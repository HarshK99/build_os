<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Build OS</title>
<link rel="icon" href="data:,">
<script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
<style>
  :root {
    --bg: #ffffff;
    --panel: #f7f8fa;
    --text: #1f2430;
    --muted: #667085;
    --faint: #98a2b3;
    --line: #e4e7ec;
    --accent: #4f46e5;
    --accent-soft: #eef0ff;
    --code-bg: #f1f3f6;
    --near: #0f7a4d; --near-soft: #e3f6ec;
    --mid: #9a6200; --mid-soft: #fdf1d8;
    --far: #667085; --far-soft: #eceef2;
    /* One colour per sidebar group's icon. */
    --icon-build: #4f46e5; --icon-playbooks: #0e7490; --icon-founder: #b45309;
    --icon-rules: #be185d; --icon-tools: #15803d; --icon-other: #667085;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1115;
      --panel: #151821;
      --text: #e3e6ec;
      --muted: #98a1b3;
      --faint: #6b7385;
      --line: #262b37;
      --accent: #9aa2ff;
      --accent-soft: #1e2140;
      --code-bg: #1c202b;
      --near: #6fdca6; --near-soft: #12301f;
      --mid: #f0c36a; --mid-soft: #35290f;
      --far: #98a1b3; --far-soft: #222733;
      --icon-build: #9aa2ff; --icon-playbooks: #5fd0e8; --icon-founder: #f5b85c;
      --icon-rules: #f48fbf; --icon-tools: #6fdca6; --icon-other: #98a1b3;
    }
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; scroll-padding-top: 24px; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 16px/1.65 -apple-system, "Segoe UI", Inter, Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  /* Three columns: where I can go · what I'm reading · where I am in it. */
  .layout { display: grid; grid-template-columns: 248px minmax(0, 1fr) 232px; min-height: 100vh; }

  .nav {
    position: sticky; top: 0; height: 100vh; overflow-y: auto;
    background: var(--panel); border-right: 1px solid var(--line);
    padding: 24px 12px 40px;
  }
  .brand { font-weight: 700; font-size: 17px; padding: 0 10px 16px; letter-spacing: -0.01em; }
  .label {
    font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--faint); padding: 18px 10px 4px;
    display: flex; align-items: center; gap: 7px;
  }
  .label svg {
    width: 14px; height: 14px; flex: none; color: var(--icon);
    fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
  }
  .nav a {
    display: block; padding: 5px 10px; border-radius: 6px;
    color: var(--muted); text-decoration: none; font-size: 14px; line-height: 1.4;
  }
  .nav a:hover { color: var(--text); background: var(--line); }
  .nav a.active { color: var(--accent); background: var(--accent-soft); font-weight: 600; }
  /* An open hunt's files, under "Hunts". */
  .nav a.sub { padding: 3px 10px 3px 24px; font-size: 13px; }
  .nav a.sub.active { background: none; }
  #pagesBox > summary { display: none; }

  #search {
    width: 100%; padding: 7px 10px; border-radius: 6px; border: 1px solid var(--line);
    background: var(--bg); color: var(--text); font: inherit; font-size: 14px;
  }
  #search:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  #results { margin-top: 6px; }
  #results a { padding: 7px 10px; }
  #results .where { display: block; font-size: 11px; font-weight: 600; color: var(--accent); }
  #results .snippet { display: block; font-size: 12.5px; color: var(--muted); }
  #results mark, .flash { background: #ffe58a; color: #1f2430; }
  #results mark { border-radius: 3px; padding: 0 1px; }
  #results .none { padding: 7px 10px; font-size: 13px; color: var(--muted); }
  .flash { transition: background 0.3s; border-radius: 4px; }

  /* The page's own headings: quieter than the page list, marked by a line, not a fill. */
  .toc { position: sticky; top: 0; height: 100vh; overflow-y: auto; padding: 48px 20px 40px 8px; }
  .toc .label { padding: 0 0 8px 12px; }
  .toc a, .contents a {
    display: block; padding: 3px 0 3px 12px; border-left: 2px solid var(--line);
    color: var(--muted); text-decoration: none; font-size: 13px; line-height: 1.45;
  }
  .toc a:hover, .contents a:hover { color: var(--text); }
  .toc a.sub, .contents a.sub { padding-left: 24px; font-size: 12.5px; color: var(--faint); }
  .toc a.active { color: var(--accent); border-left-color: var(--accent); }
  .contents { display: none; margin: 0 0 24px; border: 1px solid var(--line); border-radius: 8px; padding: 4px 14px; }
  .contents summary { cursor: pointer; font-size: 14px; font-weight: 600; color: var(--muted); padding: 8px 0; }
  .contents[open] { padding-bottom: 12px; }

  main { padding: 48px 80px 120px; max-width: 968px; }
  main h1 { font-size: 34px; line-height: 1.2; letter-spacing: -0.02em; margin: 0 0 12px; text-wrap: balance; }
  main h2 {
    font-size: 24px; letter-spacing: -0.01em; margin: 56px 0 14px;
    padding-top: 28px; border-top: 1px solid var(--line);
  }
  main h3 { font-size: 18px; margin: 32px 0 10px; }
  main p, main li { color: var(--text); text-wrap: pretty; }
  main a { color: var(--accent); }
  main ul, main ol { padding-left: 22px; }
  main li { margin: 6px 0; }
  code {
    font: 13.5px/1.5 ui-monospace, "Cascadia Code", Consolas, monospace;
    background: var(--code-bg); padding: 2px 6px; border-radius: 5px;
  }
  pre { background: var(--code-bg); padding: 16px; border-radius: 8px; overflow-x: auto; }
  pre code { background: none; padding: 0; }
  .table-wrap { overflow-x: auto; margin: 16px 0 24px; border: 1px solid var(--line); border-radius: 8px; }
  table { border-collapse: collapse; width: 100%; font-size: 14.5px; }
  th, td { text-align: left; padding: 10px 14px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { background: var(--panel); font-weight: 600; font-size: 13px; color: var(--muted); white-space: nowrap; }
  tr:last-child td { border-bottom: none; }
  .error, .empty { color: var(--muted); padding: 24px 0; }

  .filters { display: flex; flex-wrap: wrap; gap: 8px; margin: 20px 0 4px; }
  .filters button {
    font: inherit; font-size: 13.5px; padding: 5px 12px; border-radius: 999px; cursor: pointer;
    border: 1px solid var(--line); background: var(--bg); color: var(--muted);
  }
  .filters button:hover { color: var(--text); }
  .filters button.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); font-weight: 600; }
  .filters button span { opacity: 0.7; margin-left: 2px; font-variant-numeric: tabular-nums; }
  td .parts { display: block; font-size: 12.5px; color: var(--muted); }
  td .path { display: block; font: 12px/1.5 ui-monospace, "Cascadia Code", Consolas, monospace; color: var(--faint); white-space: nowrap; }
  td.nowrap { white-space: nowrap; font-variant-numeric: tabular-nums; }
  td a.view { font-weight: 600; text-decoration: none; }
  td a.view:hover { text-decoration: underline; }

  /* In a hunt: how far a quote's author is from the group the hunt is about. */
  .tier {
    display: inline-block; font-size: 11.5px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase;
    padding: 1px 8px; border-radius: 999px; vertical-align: 1px;
  }
  .tier.near { color: var(--near); background: var(--near-soft); }
  .tier.mid { color: var(--mid); background: var(--mid-soft); }
  .tier.far { color: var(--far); background: var(--far-soft); }
  li.off { display: none; }
  .copy-note { font-size: 12.5px; line-height: 1.4; color: var(--muted); padding: 0 10px 12px; }

  @media (max-width: 1200px) {
    .layout { grid-template-columns: 248px minmax(0, 1fr); }
    .toc { display: none; }
    .contents:not([hidden]) { display: block; }
  }
  @media (max-width: 860px) {
    .layout { grid-template-columns: minmax(0, 1fr); }
    .nav { position: static; height: auto; border-right: none; border-bottom: 1px solid var(--line); padding: 16px 16px 12px; }
    .brand { padding: 0 0 12px; }
    .copy-note { padding: 0 0 12px; }
    /* Projects on a phone: the filters already show the folder, and the date is what matters. */
    .wide { display: none; }
    #pagesBox > summary {
      display: flex; justify-content: space-between; cursor: pointer; list-style: none;
      font-size: 14px; font-weight: 600; color: var(--muted); padding: 12px 0 4px;
    }
    #pagesBox > summary::after { content: "▾"; }
    #pagesBox[open] > summary::after { content: "▴"; }
    main { padding: 24px 24px 80px; }
  }
</style>
</head>
<body>
<div class="layout">
  <aside class="nav">
    <div class="brand">Build OS</div>
    <div class="copy-note" id="copyNote" hidden></div>
    <input id="search" type="search" placeholder="Search this page" autocomplete="off">
    <div id="results"></div>
    <details id="pagesBox" open>
      <summary>Pages</summary>
      <nav id="docs"></nav>
    </details>
  </aside>
  <main id="content"></main>
  <aside class="toc" id="tocCol">
    <div class="label">On this page</div>
    <nav id="toc"></nav>
  </aside>
</div>

<script>
const content = document.getElementById("content");
const toc = document.getElementById("toc");
const tocCol = document.getElementById("tocCol");
const docsNav = document.getElementById("docs");
const params = new URLSearchParams(location.search);
const page = params.get("page");
const hunt = params.get("hunt");
let current = params.get("doc") || "BUILD_OS.md";
let huntFile = params.get("file");
let projectFilter = "All";
let tierFilter = "all";
let hunts = [];
let observer;

const slug = (text) => text.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
const esc = (text) => String(text).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const pageName = (file) => file.replace(/\.md$/i, "").replace(/_/g, " ").toLowerCase().replace(/\b[a-z]/g, (c) => c.toUpperCase()).replace(/\bOs\b/, "OS");
// The year only when it isn't this one, so the date fits beside the name on a phone.
const day = (ms) => new Date(ms).toLocaleDateString("en-GB", {
  day: "numeric", month: "short",
  ...(new Date(ms).getFullYear() !== new Date().getFullYear() && { year: "numeric" }),
});
// The online copy on Vercel has no server behind it; it reads the snapshot the laptop's viewer saved.
const online = !["localhost", "127.0.0.1"].includes(location.hostname);

// The sidebar's groups. A page not listed here lands in "Other", so a new .md file still shows up.
// A "?…" entry is a page the viewer builds itself rather than a .md file.
const GROUPS = [
  ["Build OS", [["BUILD_OS.md", "Build OS"], ["SETUP.md", "Setup"], ["LOG.md", "Log"], ["product_sense.md", "Why Build OS exists"]]],
  ["Playbooks", [["PRODUCT_SENSE_PLAYBOOK.md", "Product sense"], ["APP_PLAYBOOK.md", "App"], ["DESIGN_PLAYBOOK.md", "Design"], ["WEBSITE_PLAYBOOK.md", "Website"], ["CONTENT_PLAYBOOK.md", "Content"]]],
  ["Founder OS", [["FOUNDER_OS.md", "Founder OS"], ["HOW_I_DECIDE.md", "How I decide"], ["RHYTHM.md", "Rhythm"], ["IDEA_PLAYBOOK.md", "Idea playbook"], ["USING_THE_IDEA_PLAYBOOK.md", "Using the idea playbook"], ["?hunts", "Hunts"]]],
  ["Rules", [["HOW_I_WORK.md", "How I Work"], ["CLAUDE_INSTRUCTIONS.md", "Claude rules"]]],
  ["Tools", [["?projects", "Projects"], ["?templates", "Templates"]]],
];

// A small line icon before each group's name, each in its own colour from the --icon-* set.
const ICONS = {
  "Build OS": ["build", '<path d="m12 2 9 5-9 5-9-5 9-5z"/><path d="m3 12 9 5 9-5"/><path d="m3 17 9 5 9-5"/>'],
  "Playbooks": ["playbooks", '<path d="M2 4h6a4 4 0 0 1 4 4v13a3 3 0 0 0-3-3H2z"/><path d="M22 4h-6a4 4 0 0 0-4 4v13a3 3 0 0 1 3-3h7z"/>'],
  "Founder OS": ["founder", '<circle cx="12" cy="12" r="10"/><path d="m16.24 7.76-2.12 6.36-6.36 2.12 2.12-6.36z"/>'],
  "Rules": ["rules", '<path d="m3 6 2 2 4-4"/><path d="m3 16 2 2 4-4"/><path d="M13 6h8"/><path d="M13 12h8"/><path d="M13 18h8"/>'],
  "Tools": ["tools", '<path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94z"/>'],
  "Other": ["other", '<path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2z"/>'],
};
const label = (title) => {
  const [color, paths] = ICONS[title] || ICONS.Other;
  return `<div class="label"><svg viewBox="0 0 24 24" aria-hidden="true" style="--icon: var(--icon-${color})">${paths}</svg>${esc(title)}</div>`;
};

const huntHref = (name, file) => `?hunt=${encodeURIComponent(name)}` + (file ? `&file=${encodeURIComponent(file)}` : "");

async function loadDocList() {
  const docs = await fetch("/_docs").then((r) => r.json()).catch(() => ["BUILD_OS.md"]);
  const link = (href, label, on, cls = "") => `<a href="${href}" class="${cls} ${on ? "active" : ""}">${esc(label)}</a>`;
  const listed = new Set(GROUPS.flatMap(([, items]) => items.map(([file]) => file)));
  const others = docs.filter((d) => !listed.has(d));

  const entry = ([file, label]) => {
    if (file === "?hunts") {
      // An open hunt lists its own files under this entry.
      const open = hunts.find((h) => h.name === hunt);
      return link("?page=hunts", label, page === "hunts" || !!hunt) +
        (open ? link(huntHref(open.name), open.name, false, "sub") +
          open.files.map((f) => link(huntHref(open.name, f), pageName(f), f === huntFile, "sub")).join("") : "");
    }
    if (file.startsWith("?")) return link(`?page=${file.slice(1)}`, label, page === file.slice(1));
    return docs.includes(file) ? link(`?doc=${encodeURIComponent(file)}`, label, !page && !hunt && file === current) : "";
  };

  let html = GROUPS.map(([title, items]) => {
    const links = items.map(entry).join("");
    return links ? label(title) + links : "";
  }).join("");
  if (others.length) html += label("Other") + others.map((d) => link(`?doc=${encodeURIComponent(d)}`, pageName(d), !page && !hunt && d === current)).join("");
  docsNav.innerHTML = html;
}

async function loadHunts() {
  const data = await fetch("/_hunts").then((r) => r.json()).catch(() => null);
  hunts = data?.hunts || [];
  return data;
}

function setToc(headings) {
  observer?.disconnect();
  toc.innerHTML = "";
  tocCol.hidden = headings.length === 0;
  content.querySelector(".contents")?.remove();
  if (!headings.length) return;

  const seen = {};
  const links = headings.map((h) => {
    let id = slug(h.textContent);
    seen[id] = (seen[id] || 0) + 1;
    if (seen[id] > 1) id += "-" + seen[id];
    h.id = id;
    return `<a href="#${id}" class="${h.tagName === "H3" ? "sub" : ""}">${esc(h.textContent)}</a>`;
  }).join("");
  toc.innerHTML = links;

  // On narrower screens the right column is gone, so the same list folds in above the page.
  const box = document.createElement("details");
  box.className = "contents";
  box.innerHTML = `<summary>Contents</summary>${links}`;
  const title = content.querySelector("h1");
  title ? title.after(box) : content.prepend(box);
  box.addEventListener("click", (e) => { if (e.target.tagName === "A") box.open = false; });

  observer = new IntersectionObserver((entries) => {
    entries.forEach((entry) => {
      if (!entry.isIntersecting) return;
      toc.querySelectorAll("a").forEach((a) =>
        a.classList.toggle("active", a.getAttribute("href") === "#" + entry.target.id));
    });
  }, { rootMargin: "0px 0px -75% 0px" });
  headings.forEach((h) => observer.observe(h));
}

function filterButtons(items, key, chosen) {
  const counts = {};
  items.forEach((item) => { counts[item[key]] = (counts[item[key]] || 0) + 1; });
  return [["All", items.length], ...Object.entries(counts).sort((a, b) => b[1] - a[1])]
    .map(([name, n]) => `<button data-value="${esc(name)}" class="${name === chosen ? "on" : ""}">${esc(name)} <span>${n}</span></button>`)
    .join("");
}

// Every project folder, read live from disk by the viewer.
async function renderProjects() {
  let data;
  try {
    const res = await fetch("/_projects");
    if (!res.ok) throw new Error(res.status);
    data = await res.json();
  } catch {
    content.innerHTML = '<p class="error">Could not read the project folders. Close this tab and open Build OS again from the Start Menu.</p>';
    return;
  }
  if (projectFilter !== "All" && !data.projects.some((p) => p.group === projectFilter)) projectFilter = "All";
  const shown = data.projects.filter((p) => projectFilter === "All" || p.group === projectFilter);
  const rows = shown.map((p) => `<tr>
      <td><strong>${esc(p.name)}</strong>${p.parts.length ? `<span class="parts">${esc(p.parts.join(", "))}</span>` : ""}</td>
      <td class="wide">${esc(p.group)}</td>
      <td>${esc(p.kind)}</td>
      <td class="nowrap wide">${p.repoUrl ? `<a href="${esc(p.repoUrl)}" target="_blank" rel="noopener">${esc(p.git)}</a>` : esc(p.git)}</td>
      <td class="nowrap">${day(p.changed)}</td>
    </tr>`).join("");

  const scroll = window.scrollY;
  content.innerHTML = `<h1>Projects</h1>
    <p>${data.projects.length} project folders in <code>${esc(data.root)}</code>, most recently changed first. ${online
      ? "Copied from the laptop the last time Build OS was opened there."
      : "Read from disk each time this page opens, and saved to <code>snapshot</code> for the online copy."}</p>
    <div class="filters">${filterButtons(data.projects, "group", projectFilter)}</div>
    <div class="table-wrap"><table>
      <thead><tr><th>Project</th><th class="wide">Folder</th><th>Kind</th><th class="wide">Git</th><th>Changed</th></tr></thead>
      <tbody>${rows}</tbody>
    </table></div>`;
  content.querySelectorAll(".filters button").forEach((button) =>
    button.addEventListener("click", () => { projectFilter = button.dataset.value; renderProjects(); }));
  setToc([]);
  document.title = "Projects";
  window.scrollTo(0, scroll);
  runSearch();
}

// Pages meant to be copied into a project and filled in, kept in build_os\templates.
async function renderTemplates() {
  let templates;
  try {
    const res = await fetch("/_templates");
    if (!res.ok) throw new Error(res.status);
    templates = await res.json();
  } catch {
    content.innerHTML = '<p class="error">Could not read the templates folder. Close this tab and open Build OS again from the Start Menu.</p>';
    return;
  }
  const rows = templates.map((t) => `<tr>
      <td><a class="view" href="/templates/${encodeURIComponent(t.file)}" target="_blank" rel="noopener">${esc(t.title)}</a><span class="path">templates/${esc(t.file)}</span></td>
      <td>${esc(t.about)}</td>
    </tr>`).join("");
  content.innerHTML = `<h1>Templates</h1>
    <p>Pages to copy into a project and fill in. Open one to preview it. To use it, copy the file into the project's <code>docs</code> folder and replace the block marked at the top of its script. A fix to a template's code goes into the file here too, so later projects get it.</p>
    ${templates.length ? `<div class="table-wrap"><table>
      <thead><tr><th>Template</th><th>What it is for</th></tr></thead>
      <tbody>${rows}</tbody>
    </table></div>` : '<p class="empty">No templates yet. Put an .html file in <code>build_os\\templates</code> and it shows here.</p>'}`;
  setToc([]);
  document.title = "Templates";
  runSearch();
}

// Every Idea Playbook hunt: one folder each in founder_os\hunts.
async function renderHunts() {
  const data = await loadHunts();
  if (!data) {
    content.innerHTML = '<p class="error">Could not read the hunts folder. Close this tab and open Build OS again from the Start Menu.</p>';
    return;
  }
  const rows = data.hunts.map((h) => `<tr>
      <td><a class="view" href="${huntHref(h.name)}">${esc(h.name)}</a></td>
      <td>${h.files.length ? h.files.map((f) => `<a href="${huntHref(h.name, f)}">${esc(pageName(f))}</a>`).join(", ") : '<span class="parts">No .md files yet</span>'}</td>
      <td class="nowrap">${day(h.changed)}</td>
    </tr>`).join("");
  content.innerHTML = `<h1>Hunts</h1>
    <p>Idea Playbook hunts in <code>${esc(data.root)}</code>, one folder each, most recently changed first. Their files are read live, like every other page here.</p>
    ${data.hunts.length ? `<div class="table-wrap"><table>
      <thead><tr><th>Hunt</th><th>Files</th><th>Last changed</th></tr></thead>
      <tbody>${rows}</tbody>
    </table></div>` : '<p class="empty">No hunts yet. A hunt starts as a folder in founder_os\\hunts; the Idea Playbook says how.</p>'}`;
  setToc([]);
  document.title = "Hunts";
  loadDocList();
  runSearch();
}

// A quote line marked **near**, **mid** or **far** gets a coloured tag, and the page a filter.
function markTiers() {
  const isTier = (el) => /^(near|mid|far)$/.test(el.textContent);
  // A line that names more than one is the explanation of the marks, not a quote.
  const marks = [...content.querySelectorAll("li strong")].filter((el) =>
    isTier(el) && [...el.closest("li").querySelectorAll("strong")].filter(isTier).length === 1);
  marks.forEach((el) => {
    const tag = document.createElement("span");
    tag.className = "tier " + el.textContent;
    tag.textContent = el.textContent;
    el.replaceWith(tag);
  });
  if (marks.length < 4) return;

  const apply = () => {
    content.querySelectorAll("li").forEach((li) => {
      const tier = li.querySelector(":scope > .tier, :scope > p > .tier");
      li.classList.toggle("off", tierFilter !== "all" && !!tier && !tier.classList.contains(tierFilter));
    });
    bar.querySelectorAll("button").forEach((b) => b.classList.toggle("on", b.dataset.value === tierFilter));
  };
  const count = (tier) => content.querySelectorAll(".tier." + tier).length;
  const bar = document.createElement("div");
  bar.className = "filters";
  bar.innerHTML = [["all", "All quotes", marks.length], ["near", "Near", count("near")], ["mid", "Mid", count("mid")], ["far", "Far", count("far")]]
    .map(([tier, label, n]) => `<button data-value="${tier}">${label} <span>${n}</span></button>`).join("");
  bar.querySelectorAll("button").forEach((b) => b.addEventListener("click", () => { tierFilter = b.dataset.value; apply(); }));
  content.querySelector("h1")?.after(bar);
  apply();
}

async function render() {
  if (page === "projects") return renderProjects();
  if (page === "templates") return renderTemplates();
  if (page === "hunts") return renderHunts();
  let source = "/" + encodeURIComponent(current);
  if (hunt) {
    await loadHunts();
    const open = hunts.find((h) => h.name === hunt);
    if (!open?.files.includes(huntFile)) huntFile = open?.files[0];
    if (!huntFile) {
      content.innerHTML = `<h1>${esc(hunt)}</h1><p class="empty">No .md files in this hunt yet.</p>`;
      setToc([]);
      loadDocList();
      return;
    }
    source = `/_hunt/${encodeURIComponent(hunt)}/${encodeURIComponent(huntFile)}`;
    loadDocList();
  }
  let md;
  try {
    const res = await fetch(source);
    if (!res.ok) throw new Error(res.status);
    md = await res.text();
  } catch {
    content.innerHTML = `<p class="error">Could not load ${esc(hunt ? huntFile : current)}. Start the viewer with <code>node serve.mjs</code> and open http://localhost:4321.</p>`;
    return;
  }

  const scroll = window.scrollY;
  const box = content.querySelector(".contents");
  const wasOpen = box?.open;
  content.innerHTML = window.marked ? marked.parse(md) : `<pre>${md.replace(/</g, "&lt;")}</pre>`;

  content.querySelectorAll("table").forEach((table) => {
    const wrap = document.createElement("div");
    wrap.className = "table-wrap";
    table.replaceWith(wrap);
    wrap.appendChild(table);
  });
  // Links to the web open in a new tab, so the page stays where it was.
  content.querySelectorAll('a[href^="http"]').forEach((a) => { a.target = "_blank"; a.rel = "noopener"; });
  if (hunt) markTiers();

  setToc([...content.querySelectorAll("h2, h3")]);
  if (wasOpen) content.querySelector(".contents").open = true;
  const title = content.querySelector("h1");
  document.title = title ? title.textContent : hunt ? `${hunt} hunt` : "Build OS";
  window.scrollTo(0, scroll);
  runSearch();
}

const search = document.getElementById("search");
const results = document.getElementById("results");

// Plain keyword match over paragraphs, list items and table rows.
function runSearch() {
  const query = search.value.trim().replace(/^[/$]/, "").toLowerCase();
  results.innerHTML = "";
  if (query.length < 2) return;

  let heading = "";
  let count = 0;
  for (const el of content.querySelectorAll("h1, h2, h3, p, li, tr")) {
    if (el.closest(".contents")) continue;
    if (/^H[1-3]$/.test(el.tagName)) heading = el.textContent;
    if (el.tagName === "P" && el.closest("li")) continue;
    if (el.tagName === "TR" && el.querySelector("th")) continue;

    const text = el.textContent.replace(/\s+/g, " ").trim();
    const at = text.toLowerCase().indexOf(query);
    if (at === -1) continue;
    if (++count > 15) break;

    const start = Math.max(0, at - 30);
    const link = document.createElement("a");
    link.href = "#";
    const where = document.createElement("span");
    where.className = "where";
    where.textContent = heading;
    const snippet = document.createElement("span");
    snippet.className = "snippet";
    const mark = document.createElement("mark");
    mark.textContent = text.slice(at, at + query.length);
    snippet.append((start > 0 ? "…" : "") + text.slice(start, at), mark, text.slice(at + query.length, at + query.length + 60));
    link.append(where, snippet);
    link.addEventListener("click", (event) => {
      event.preventDefault();
      el.scrollIntoView({ block: "center" });
      el.classList.add("flash");
      setTimeout(() => el.classList.remove("flash"), 1600);
    });
    results.appendChild(link);
  }
  if (!count) results.innerHTML = '<div class="none">No matches</div>';
}

search.addEventListener("input", runSearch);
search.addEventListener("keydown", (event) => {
  if (event.key === "Enter") results.querySelector("a")?.click();
});

// On a phone the page list starts folded, so the page itself comes first.
if (matchMedia("(max-width: 860px)").matches) document.getElementById("pagesBox").open = false;

loadDocList();
render().then(() => {
  if (location.hash) document.getElementById(location.hash.slice(1))?.scrollIntoView();
});
// Pick up edits to the markdown when you come back to the tab.
window.addEventListener("focus", render);
if (online) {
  fetch("/snapshot/_taken.json").then((r) => r.json()).then(({ at }) => {
    const when = new Date(at).toLocaleString("en-GB", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" });
    const note = document.getElementById("copyNote");
    note.textContent = `Snapshot from ${when}. Read-only copy.`;
    note.hidden = false;
  }).catch(() => {});
} else {
  // Tell the viewer this page is still open; it shuts down a few minutes after the last ping.
  setInterval(() => fetch("/_ping").catch(() => {}), 20000);
}
</script>
